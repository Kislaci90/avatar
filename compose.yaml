services:
  database:
    image: 'postgis/postgis:16-3.4'
    ports:
      - '5432:5432'
    environment:
      - 'POSTGRES_USER=admin'
      - 'POSTGRES_DB=avatar'
      - 'POSTGRES_PASSWORD=admin'
  mailserver:
    image: mailhog/mailhog
    restart: always
    ports:
      - '1025:1025'
      - '8025:8025'