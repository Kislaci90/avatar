spring:
  graphql:
    graphiql:
      enabled: true
    schema:
      printer:
        enabled: true
      locations: classpath*:graphql/**/
    cors:
      allowed-origins: "*"
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY:test-secret-key-32-chars-minimum-12345678}
    expiration-time: 3600000

app:
  mail:
    from: noreply@avatar.local
  email-verification:
    url: http://localhost:3000/verify-email
    expiry-hours: 24

