replicaCount: 1
image:
  tag: local
  pullPolicy: Always
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "local"
  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: "update"
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://postgres:5432/avatar"
  - name: SPRING_DATASOURCE_USERNAME
    value: "postgres"
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: postgres-secret
        key: password
  - name: GRAPHQL_SERVLET_MAPPING
    value: "/graphql"
  - name: LOGGING_LEVEL_ROOT
    value: "DEBUG"
