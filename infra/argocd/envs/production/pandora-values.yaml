replicaCount: 3
image:
  tag: v1.0.0
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: "validate"
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://postgres:5432/avatar"
  - name: SPRING_DATASOURCE_USERNAME
    value: "postgres"
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: postgres-secret
        key: password
  - name: GRAPHQL_SERVLET_MAPPING
    value: "/graphql"
  - name: LOGGING_LEVEL_ROOT
    value: "WARN"
